services:
  redis:
    image: redis:7-alpine
    container_name: workqueue-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    build: ../producer-service
    container_name: workqueue-producer
    environment:
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ../worker-service
    container_name: workqueue-worker
    environment:
      SPRING_DATA_REDIS_HOST: redis
      WORKER_EMAIL_URL: http://email:8080
      WORKER_IMAGE_URL: http://image:8080
      WORKER_VIDEO_URL: http://video:8080
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  email:
    build: ../email-service
    container_name: workqueue-email
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy

  image:
    build: ../image-service
    container_name: workqueue-image
    ports:
      - "8083:8080"
    depends_on:
      redis:
        condition: service_healthy

  video:
    build: ../video-service
    container_name: workqueue-video
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy
